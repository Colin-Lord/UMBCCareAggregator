{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}My Website{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS for UMBC colors -->
    <link rel="stylesheet" href="{% static 'aggregator/style.css' %}?v=2">

</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <!-- Website Name (Left) -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                <img src="{% static 'aggregator/images/umbc_crest.png' %}" alt="" height="40">
                <span>UMBC</span>
                {% if user.is_authenticated %}
                    <i class="fa-solid fa-user ms-2" aria-hidden="true"></i>
                    <span>{{ user.get_username }}</span>
                {% endif %}
            </a>

            <!-- Mobile Menu Button -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"> 
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links (Right) -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                    <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                    <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'data' %}">Data</a>
                    <a class="nav-link" href="{% url 'office' %}">Office</a>
                    <a class="nav-link" href="{% url 'users' %}">Users</a>
                    <a class="nav-link" href="{% url 'login' %}">Login</a>
                </div>
            </div>

        </div>
    </nav>

    <!-- Page-specific Content -->
    <main class="container mt-3">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
