{% extends "aggregator/base.html" %}

{% block title %}Record{% endblock %}

{% block content %}
    <h1 class="mb-4">Add Data Record</h1>

    <form method="post">
        {% csrf_token %}

        <div class="row g-3">

            <!-- Office Name -->
            <div class="col-md-12">
                <label for="office_name" class="form-label">Office</label>
                <input type="text" class="form-control"
                       id="office_name" name="office_name"
                       value="{{ user.office.name }}" readonly>
            </div>

            <!-- Period Start -->
            <div class="col-md-6">
                <label for="period_start" class="form-label">Period Start</label>
                <input type="date" class="form-control"
                       id="period_start" name="period_start" required>
            </div>

            <!-- Period End -->
            <div class="col-md-6">
                <label for="period_end" class="form-label">Period End</label>
                <input type="date" class="form-control"
                       id="period_end" name="period_end" required>
            </div>

            <!-- Student Level -->
            <div class="col-md-6">
                <label for="student_level" class="form-label">Student Level</label>
                <select class="form-select" id="student_level"
                        name="student_level" required>
                    <option value="" disabled selected>Select Student Level</option>
                    <option value="graduate">Graduate</option>
                    <option value="undergraduate">Undergraduate</option>
                </select>
            </div>

            <!-- Metric -->
            <div class="col-md-6">
                <label for="metric" class="form-label">Metric</label>
                <select class="form-select" id="metric"
                        name="metric" required>

                    <option value="" disabled selected>Select Metric</option>

                    {% for value, label in metrics.items %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}

                </select>
            </div>

            <!-- Value -->
            <div class="col-md-6">
                <label for="value" class="form-label">Value</label>
                <input type="number" class="form-control"
                       id="value" name="value" step="any" required>
            </div>

            <!-- Unit -->
            <div class="col-md-6">
                <label for="unit" class="form-label">Unit</label>
                <input type="text" class="form-control"
                       id="unit" name="unit"
                       placeholder="e.g. students, referrals, lb" required>
            </div>

        </div>

        <button type="submit" class="btn btn-submit mt-4">
            Submit Record
        </button>
    </form>
{% endblock %}
